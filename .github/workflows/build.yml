# 编译 workflow：推送 / PR / 手动触发时把 App 编出来，APK 作为 Actions Artifact 下载。
#
# 设计要点：
# 1. 只做编译，不跑单测 —— 本项目的约定是「提交前不跑单测，由作者自行测试」，
#    单测要跑请手动在本地执行 ./gradlew testDebugUnitTest。
# 2. YUNX_USE_MIRROR=false 是必须的：settings.gradle.kts 默认走阿里云镜像加速（国内本地构建用），
#    而 GitHub runner 访问阿里云会 502，必须切回 Google / Maven Central 官方源。
# 3. runner 自带 Android SDK（licenses 已接受），AGP 会按 compileSdk 36 自动补装缺失组件，
#    所以这里不手动装 SDK，也不写 local.properties。
# 4. concurrency + cancel-in-progress：同一分支连续推送时取消上一次，省额度也省等待。
# 5. release 变体默认不编：它开 R8 混淆 + 资源压缩，耗时是 debug 的 2~3 倍，
#    需要时用「Run workflow」勾上 release 再跑。未配置签名证书时产物是 app-release-unsigned.apk。
name: Build APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: 同时构建 release（未签名，开 R8，较慢）
        type: boolean
        default: false
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/build.yml'
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assemble ${{ github.event.inputs.release == 'true' && 'debug + release' || 'debug' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # 见文件头第 2 条：CI 上必须关掉国内镜像
      YUNX_USE_MIRROR: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 缓存 Gradle 依赖与 wrapper：首次约 5~8 分钟，命中缓存后 1~2 分钟
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK (unsigned)
        if: github.event.inputs.release == 'true'
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # 把产物信息打出来：APK 是否真的生成、多大、SHA-256 是多少，一眼可查
      - name: Show artifacts
        run: |
          set -e
          shopt -s nullglob
          for f in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            printf '%s  %s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(du -h "$f" | cut -f1)" "$f"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sluice-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK (unsigned)
        if: github.event.inputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sluice-release-unsigned-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14